<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:system-ui;padding:20px;max-width:560px;margin:auto">
<h2>VAPID keys banao</h2>
<p>Keys is hi phone/browser mein banti hain, kahin bheji nahi jaati. Kaam hone ke baad ye file site se hata dena.</p>
<button id="g" style="padding:12px 20px;font-size:16px">Keys banao</button>
<pre id="o" style="white-space:pre-wrap;word-break:break-all;margin-top:20px"></pre>
<script>
const b = a => btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
g.onclick = async () => {
  const k = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]);
  const pub = b(await crypto.subtle.exportKey("raw", k.publicKey));
  const d = (await crypto.subtle.exportKey("jwk", k.privateKey)).d;
  o.textContent = "PUBLIC KEY (index.html mein VAPID_PUBLIC + Supabase secret VAPID_PUBLIC):\n" + pub +
    "\n\nPRIVATE KEY (sirf Supabase secret VAPID_PRIVATE mein, kisi ko mat dikhana):\n" + d;
};
</script>
